<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    h2 {
      margin-top: 12px;
    }
    .test-section {
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: #333 1px solid;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    label {
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    input,
    select,
    textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 4px;
    }
    input[type="checkbox"],
    input[type="radio"] {
      width: auto;
      margin-right: 5px;
    }
    input:focus {
      outline: none;
      border-color: #4caf50;
      background-color: #f0f8ff;
    }
    button {
      padding: 10px 20px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 4px;
    }
    button:hover {
      background-color: #45a049;
    }
    button:active {
      background-color: #3d8b40;
    }
    .output {
      background-color: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      border-left: 4px solid #4caf50;
      font-family: monospace;
      font-size: 13px;
      max-height: 200px;
      overflow-y: auto;
    }
    .test-button {
      background-color: #2196f3;
      width: fit-content;
    }
    .test-button:hover {
      background-color: #0b7dda;
    }
    .checkbox-group,
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .checkbox-item,
    .radio-item {
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="test-section">
    <h2>1. Form Properties and Methods</h2>

    <form id="myForm">
      <div>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" />
      </div>

      <div>
        <label for="country">Country:</label>
        <select id="country" name="country">
          <option value="usa">USA</option>
          <option value="uk">UK</option>
          <option value="canada">Canada</option>
        </select>
      </div>

      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="agree" name="agree" />
          I agree to terms
        </label>
      </div>

      <button type="button" class="test-button" onclick="accessFormElements()">
        Test: Access Form Elements
      </button>
      <button type="button" class="test-button" onclick="getFormValues()">
        Test: Get Form Values
      </button>
      <button type="button" class="test-button" onclick="setFormValues()">
        Test: Set Form Values (sets username to 'John', checks checkbox, selects USA)
      </button>
      <button type="button" class="test-button" onclick="resetForm()">
        Test: Reset Form
      </button>
    </form>
  </div>

  <div class="test-section">
    <h2>2. Focus and Blur Events</h2>

    <form id="focusForm">
      <div>
        <input type="text" id="focusInput"/>
      </div>
    </form>

    <button type="button" class="test-button" onclick="setupFocusEvent()">
      Setup: Focus Event
    </button>
    <button type="button" class="test-button" onclick="setupBlurEvent()">
      Setup: Blur Event
    </button>
    <button type="button" class="test-button" onclick="setFocus()">
      Test: Set Focus Programmatically
    </button>
    <button type="button" class="test-button" onclick="removeFocus()">
      Test: Remove Focus Programmatically
    </button>
  </div>

  <div class="test-section">
    <h2>3. Change and Input Events</h2>

    <form id="changeForm">
      <div>
        <input type="text" id="changeInput" />
      </div>

      <div>
        <select id="changeSelect">
          <option value="option1">Option 1</option>
          <option value="option2">Option 2</option>
          <option value="option3">Option 3</option>
        </select>
      </div>

      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="changeCheckbox" />
          Check/uncheck
        </label>
      </div>
    </form>

    <button type="button" class="test-button" onclick="setupInputEvent()">
      Setup: Input Event
    </button>
    <button type="button" class="test-button" onclick="setupChangeEvent()">
      Setup: Change Event
    </button>
    <button type="button" class="test-button" onclick="setupSelectChange()">
      Setup: Select Change Event
    </button>
    <button type="button" class="test-button" onclick="setupCheckboxChange()">
      Setup: Checkbox Change Event
    </button>
  </div>

  <div class="test-section">
    <h2>4. Clipboard Events (Cut, Copy, Paste)</h2>

    <form id="clipboardForm">
      <div>
        <label for="clipboardInput">Try cut, copy, paste:</label>
        <input type="text" id="clipboardInput" />
      </div>
    </form>

    <button type="button" class="test-button" onclick="setupCutEvent()">
      Setup: Cut Event
    </button>
    <button type="button" class="test-button" onclick="setupCopyEvent()">
      Setup: Copy Event
    </button>
    <button type="button" class="test-button" onclick="setupPasteEvent()">
      Setup: Paste Event
    </button>
  </div>

  <div class="test-section">
    <h2>5. Form Submission</h2>

    <form id="submitForm">
      <div>
        <label for="submitUsername">Username:</label>
        <input type="text" id="submitUsername" name="submitUsername" />
      </div>

      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="submitAgree" name="submitAgree" />
          I agree
        </label>
      </div>

      <button type="submit">Submit Form</button>
    </form>

    <button type="button" class="test-button" onclick="setupFormSubmit()">
      Setup: Form Submit Handler
    </button>
    <button type="button" class="test-button" onclick="validateFormBeforeSubmit()">
      Setup: Form Validation (username required, min 3 chars)
    </button>
  </div>

  <script src="formsControls.js"></script>
</body>
</html>
